name: ci

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: MCP smoke test
        run: node tests/smoke.mjs
      - name: Correctness and latency benchmark
        run: node tests/bench.mjs
