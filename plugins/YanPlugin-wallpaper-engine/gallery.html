<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WE 壁纸自选面板</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --card: #1c2129; --line: #2d333b;
    --text: #e6edf3; --muted: #8b949e; --accent: #2f81f7; --ok: #3fb950; --warn: #d29922; --err: #f85149;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(13,17,23,.92); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); padding: 14px 22px; }
  .head-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  h1 { font-size: 17px; font-weight: 600; }
  h1 span { color: var(--accent); }
  .stat { font-size: 12px; color: var(--muted); }
  .banner { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .banner b { color: var(--warn); font-weight: 600; }
  .filters { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
  input[type=search], select { background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 8px; padding: 7px 12px; font-size: 13px; outline: none; }
  input[type=search] { width: 240px; }
  input[type=search]:focus, select:focus { border-color: var(--accent); }
  label.chk { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; cursor: pointer; }
  main { padding: 18px 22px 60px; }
  h2 { font-size: 14px; color: var(--muted); font-weight: 600; margin: 18px 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: border-color .15s, transform .15s; }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .thumb { aspect-ratio: 16/9; background: #0a0d12 center/cover no-repeat; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
  .badge { position: absolute; top: 8px; left: 8px; font-size: 11px; padding: 2px 8px; border-radius: 20px; background: rgba(0,0,0,.65); color: #fff; }
  .badge.video { background: rgba(47,129,247,.85); }
  .badge.scene, .badge.web, .badge.application { background: rgba(210,153,34,.85); }
  .size { position: absolute; top: 8px; right: 8px; font-size: 11px; padding: 2px 8px; border-radius: 20px; background: rgba(0,0,0,.65); color: #ddd; }
  .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .title { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
  .tags { font-size: 11px; color: var(--muted); }
  .note { font-size: 11px; color: var(--muted); line-height: 1.4; flex: 1; }
  .note.no { color: var(--err); }
  .actions { display: flex; gap: 8px; }
  button { border: none; border-radius: 8px; padding: 7px 12px; font-size: 12.5px; cursor: pointer; background: var(--panel); color: var(--text); border: 1px solid var(--line); transition: filter .15s; }
  button:hover { filter: brightness(1.2); }
  button:disabled { opacity: .5; cursor: wait; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; flex: 1; }
  button.danger { color: var(--err); }
  .imported { display: flex; flex-direction: column; gap: 8px; }
  .imp-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 14px; font-size: 13px; }
  .imp-row .nm { font-weight: 600; }
  .imp-row .tech { font-size: 11px; color: var(--muted); }
  .imp-row .tech.bad { color: var(--warn); }
  .imp-row .sel { font-size: 11px; color: var(--ok); border: 1px solid var(--ok); padding: 1px 8px; border-radius: 20px; }
  .imp-row .miss { font-size: 11px; color: var(--err); }
  .imp-row .sp { flex: 1; }
  .sec-head { display: flex; align-items: center; gap: 12px; margin: 18px 0 12px; }
  .sec-head h2 { margin: 0; }
  .sec-head button { font-size: 12px; padding: 5px 12px; }
  .sec-head .hint { font-size: 11px; color: var(--muted); }
  #toast { position: fixed; bottom: 22px; right: 22px; left: auto; transform: none; z-index: 99; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; pointer-events: none; }
  .toast { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--ok); color: var(--text); padding: 10px 18px; border-radius: 10px; font-size: 13px; max-width: 420px; box-shadow: 0 6px 24px rgba(0,0,0,.5); animation: pop .2s ease; }
  .toast.err { border-left-color: var(--err); }
  .toast.info { border-left-color: var(--accent); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .empty { color: var(--muted); font-size: 13px; padding: 20px 0; }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <h1>Wallpaper Engine <span>壁纸自选</span></h1>
    <div class="stat" id="stat">加载中…</div>
  </div>
  <div class="banner">点击卡片按钮即可导入 Yan 壁纸库。视频会自动转为壁纸安全规格（H.264 / ≤1080p / ≤60fps / 无音轨），4K、HEVC 也不会黑屏或卡顿；转换失败会自动改用静态备用图。<b>注意：video 是动态壁纸；scene / web / application 只能导入静态图，不会动。</b> 导入后需打开 Yan 设置页或重启应用生效。</div>
  <div class="filters">
    <input type="search" id="q" placeholder="搜索标题 / 标签 / ID…">
    <select id="type">
      <option value="">全部类型</option>
      <option value="video">video（可动态）</option>
      <option value="scene">scene（静态预览）</option>
      <option value="web">web（静态预览）</option>
      <option value="application">application（静态预览）</option>
    </select>
    <label class="chk"><input type="checkbox" id="onlyOk" checked> 只看可导入</label>
    <label class="chk"><input type="checkbox" id="apply" checked> 导入后设为当前壁纸</label>
  </div>
</header>
<main>
  <div class="sec-head">
    <h2 id="impTitle">已导入 Yan 的壁纸</h2>
    <button id="optAll" type="button">一键修复视频兼容性</button>
    <span class="hint" id="optHint"></span>
  </div>
  <div class="imported" id="imported"></div>
  <h2 id="libTitle">Wallpaper Engine 壁纸库</h2>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>没有匹配的壁纸</div>
</main>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
let ALL = [];

function toast(msg, kind = 'ok', ms = 4200) {
  const box = $('#toast');
  Array.from(box.children).forEach(el => { if (el.dataset.text === msg) el.remove(); });
  while (box.children.length >= 3) box.firstChild.remove();
  const el = document.createElement('div');
  el.className = 'toast ' + (kind === 'ok' ? '' : kind);
  el.textContent = msg;
  el.dataset.text = msg;
  box.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

async function api(path, opts) {
  const res = await fetch(path, opts);
  return res.json();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function typeLabel(type) {
  if (type === 'video') return 'video 动态';
  if (type === 'scene' || type === 'web' || type === 'application') return type + ' 静态';
  return type;
}

function renderGrid() {
  const q = $('#q').value.trim().toLowerCase();
  const type = $('#type').value;
  const onlyOk = $('#onlyOk').checked;
  const list = ALL.filter(w =>
    (!type || w.type === type)
    && (!onlyOk || w.importable)
    && (!q || w.title.toLowerCase().includes(q) || w.id.toLowerCase().includes(q) || (w.tags || []).some(t => t.toLowerCase().includes(q))));
  $('#libTitle').textContent = `Wallpaper Engine 壁纸库（${list.length}）`;
  $('#empty').hidden = list.length > 0;
  $('#grid').innerHTML = list.map(w => `
    <div class="card">
      <div class="thumb">
        ${w.previewUrl ? `<img loading="lazy" src="${esc(w.previewUrl)}" alt="">` : '<div class="ph">无预览图</div>'}
        <span class="badge ${esc(w.type)}">${esc(typeLabel(w.type))}</span>
        <span class="size">${w.sizeMB ? w.sizeMB + 'MB' : ''}</span>
      </div>
      <div class="body">
        <div class="title">${esc(w.title)}</div>
        <div class="tags">${esc((w.tags || []).join(' · '))}${w.source === 'local' ? ' · 本地项目' : ''}</div>
        <div class="note ${w.importable ? '' : 'no'}">${esc(w.note || '')}</div>
        <div class="actions">
          <button class="primary" data-id="${esc(w.id)}" data-apply="1" ${w.importable ? '' : 'disabled'}>导入并应用</button>
          <button data-id="${esc(w.id)}" data-apply="0" ${w.importable ? '' : 'disabled'}>仅入库</button>
        </div>
      </div>
    </div>`).join('');
}

function techText(e) {
  if (e.kind !== 'video') return '图片';
  if (!e.technical) return e.fileExists ? '视频（未检测编码）' : '文件缺失';
  const t = e.technical;
  return `${t.codec || '?'} ${t.width || '?'}x${t.height || '?'}${t.fps ? '@' + t.fps : ''}${t.safe ? '' : ' · 建议修复'}`;
}

async function loadImported() {
  const r = await api('/api/imported');
  const box = $('#imported');
  if (!r.ok) { box.innerHTML = `<div class="empty">读取失败：${esc(r.error)}</div>`; return; }
  $('#impTitle').textContent = `已导入 Yan 的壁纸（${r.total}）`;
  const bits = [];
  if (r.needingFix) bits.push(`${r.needingFix} 个视频需要修复`);
  if (r.missingPoster) bits.push(`${r.missingPoster} 个缺备用图`);
  $('#optHint').textContent = bits.length ? bits.join('，') : '视频已统一为安全规格';
  if (!r.entries.length) { box.innerHTML = '<div class="empty">还没有导入过 WE 壁纸</div>'; return; }
  box.innerHTML = r.entries.map(e => `
    <div class="imp-row">
      <span class="nm">${esc(e.name)}</span>
      ${e.selected ? '<span class="sel">当前壁纸</span>' : ''}
      <span class="tech ${e.needsFix ? 'bad' : ''}">${esc(techText(e))}${e.kind === 'video' && e.posterExists ? ' · 备用图' : ''}</span>
      ${e.fileExists ? '' : '<span class="miss">文件缺失</span>'}
      <span class="sp"></span>
      ${e.kind === 'video' && e.fileExists && (e.needsFix || !e.posterExists)
        ? `<button data-opt="${esc(e.id)}">${e.needsFix ? '修复兼容性' : '补备用图'}</button>`
        : ''}
      <button class="danger" data-remove="${esc(e.id)}" data-delfile="1">移除并删文件</button>
      <button data-remove="${esc(e.id)}" data-delfile="0">仅移除</button>
    </div>`).join('');
}

async function optimize(id, btn) {
  const bulk = !id;
  const buttons = bulk ? [$('#optAll')] : [btn];
  buttons.forEach(b => { b.disabled = true; });
  const old = btn ? btn.textContent : $('#optAll').textContent;
  if (btn) btn.textContent = '修复中…';
  else $('#optAll').textContent = '修复中…';
  toast(bulk ? '正在检查并修复全部视频，可能需要几分钟…' : '正在重编码视频，可能需要几分钟…', 'info', 8000);
  try {
    const r = await api('/api/optimize', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(id ? { id } : {})
    });
    if (r.ok) {
      const changed = r.optimized || 0;
      const pending = r.pending || 0;
      const msg = changed ? `已修复 ${changed} 个视频壁纸。` : (r.note || '无需修复。');
      toast(msg + (pending ? ` 还有 ${pending} 个，请再次点击「一键修复」。` : ''), 'ok', 7000);
      loadImported();
    } else toast('修复失败：' + (r.error || '未知错误'), 'err', 8000);
  } catch (e) {
    toast('请求失败：' + e.message, 'err', 8000);
  } finally {
    buttons.forEach(b => { b.disabled = false; });
    if (btn) btn.textContent = old;
    else $('#optAll').textContent = old;
  }
}
$('#optAll').addEventListener('click', () => optimize('', null));

async function doImport(id, apply, btn) {
  const card = btn.closest('.card');
  const buttons = card.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);
  btn.textContent = '导入中…（大视频压缩需稍候）';
  try {
    const r = await api('/api/import', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, apply, compress: true })
    });
    if (r.ok) {
      const m = r.media || {};
      const tag = m.fallbackFromVideo
        ? (m.kind === 'video' ? '（已用 GIF 预览动画）' : '（视频无法转换，已用静态备用图）')
        : m.resolution
          ? `（${m.resolution}${m.kind === 'image' ? '，静态图' : (m.fps ? '@' + m.fps : '')}${m.transcoded ? '，已转码' : ''}）`
          : '';
      toast(`「${r.entry.name}」${r.applied ? '已导入并应用' : '已入库'}${tag}。打开 Yan 设置页或重启生效。`, 'ok', 6000);
      loadImported();
    } else {
      toast('导入失败：' + (r.error || '未知错误'), 'err', 8000);
    }
  } catch (e) {
    toast('请求失败：' + e.message, 'err', 8000);
  } finally {
    buttons.forEach(b => b.disabled = false);
    card.querySelector('[data-apply="1"]').textContent = '导入并应用';
    card.querySelector('[data-apply="0"]').textContent = '仅入库';
  }
}

document.addEventListener('click', async ev => {
  const imp = ev.target.closest('[data-id]');
  if (imp) { doImport(imp.dataset.id, imp.dataset.apply === '1' && $('#apply').checked, imp); return; }
  const opt = ev.target.closest('[data-opt]');
  if (opt) { optimize(opt.dataset.opt, opt); return; }
  const rm = ev.target.closest('[data-remove]');
  if (rm) {
    rm.disabled = true;
    try {
      const r = await api('/api/remove', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: rm.dataset.remove, deleteFile: rm.dataset.delfile === '1' })
      });
      if (r.ok) { toast(`已移除「${r.removed.name}」`, 'info'); loadImported(); }
      else toast('移除失败：' + r.error, 'err', 6000);
    } catch (e) { toast('请求失败：' + e.message, 'err'); }
    finally { rm.disabled = false; }
  }
});

['q', 'type', 'onlyOk'].forEach(id => $('#' + id).addEventListener('input', renderGrid));

(async () => {
  try {
    const [status, list] = await Promise.all([api('/api/status'), api('/api/list')]);
    if (status.ok) {
      $('#stat').textContent = `创意工坊 ${status.workshopWallpapers} 个 · 本地 ${status.localProjects} 个 · 视频统一 ≤1080p/H.264 · ffmpeg ${status.ffmpeg?.available ? '可用' : '不可用（大视频将用静态备用图）'}`;
    }
    if (list.ok) { ALL = list.wallpapers; renderGrid(); }
    else toast('列表加载失败：' + list.error, 'err', 8000);
    loadImported();
  } catch (e) {
    toast('面板服务连接失败：' + e.message, 'err', 8000);
  }
})();
</script>
</body>
</html>
